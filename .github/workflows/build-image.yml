name: Build & Push Sidecar Image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME_LC: ${{ github.repository_owner }}/ardyn-ads-sidecar
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ardyn-ads-sidecar

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=v1.1.0
            type=raw,value=latest

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.sidecar
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 18443:8443 \
            -e ADS_LISTEN_ADDR=0.0.0.0:8443 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:v1.1.0
          sleep 3
          curl -fsS http://localhost:18443/v1/health | tee /dev/stderr | grep -q '"ok"\|healthy\|service'
          docker rm -f smoke